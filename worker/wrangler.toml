name = "beyza-yildir-content-api"
main = "src/index.ts"
compatibility_date = "2026-10-22"
workers_dev = false

routes = [
  { pattern = "yildirbeyza.com/api/*", zone_name = "yildirbeyza.com" },
  { pattern = "yildirbeyza.com/media/*", zone_name = "yildirbeyza.com" },
  { pattern = "yildirbeyza.com/p/*", zone_name = "yildirbeyza.com" },
  { pattern = "yildirbeyza.com/w/*", zone_name = "yildirbeyza.com" },
  { pattern = "yildirbeyza.com/e/*", zone_name = "yildirbeyza.com" },
  { pattern = "yildirbeyza.com/tr/*", zone_name = "yildirbeyza.com" },
  { pattern = "yildirbeyza.com/en/*", zone_name = "yildirbeyza.com" },
  { pattern = "yildirbeyza.com/sitemap-content.xml", zone_name = "yildirbeyza.com" }
]

[vars]
PUBLIC_ORIGIN = "https://yildirbeyza.com"

[[d1_databases]]
binding = "DB"
database_name = "beyza-yildir-content"
database_id = "cdec5b37-8bc1-459e-a126-52ee83031524"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "beyza-yildir-media"
