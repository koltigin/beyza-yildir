<!doctype html>
<html lang="tr">
  <head>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" /><title>Beyza Yıldır — Studio</title><link rel="stylesheet" href="/studio/styles.css?v=20261024-video-editor" />
  </head>
  <body>
    <main class="studio-shell">
      <header><a href="/" aria-label="Siteye dön">← Beyza Yıldır</a><div class="studio-header-actions"><p>Stüdyo / içerik yönetimi</p><a class="studio-logout" href="/cdn-cgi/access/logout">Çıkış</a></div></header>
      <div class="studio-workspace">
        <aside class="studio-sidebar"><p class="kicker">İçerik yönetimi</p><h1>Stüdyo</h1><nav class="content-tabs" aria-label="İçerik kategorileri"><button type="button" class="is-active" data-content-filter="all">Tümü <span data-count="all">0</span></button><button type="button" data-content-filter="work">Eserler <span data-count="work">0</span></button><button type="button" data-content-filter="post">Blog <span data-count="post">0</span></button><button type="button" data-content-filter="exhibition">Etkinlikler <span data-count="exhibition">0</span></button><button type="button" data-content-filter="award">Ödüller <span data-count="award">0</span></button></nav><div class="sidebar-create"><p class="kicker">Yeni içerik</p><button type="button" data-type="work">+ Yeni eser</button><button type="button" data-type="post">+ Yeni blog yazısı</button><button type="button" data-type="exhibition">+ Yeni etkinlik</button><button type="button" data-type="award">+ Yeni ödül</button><button type="button" data-type="about">Hakkında sayfasını düzenle ↗</button></div></aside>
      <section class="editor" hidden aria-live="polite"><div class="editor-top"><div><p id="editor-label" class="kicker"></p><p id="editor-help" class="editor-help"></p></div><button id="close-editor" type="button">Kapat ×</button></div><form id="content-form"><label id="media-label">Kapak görseli / kısa video <small>JPG, PNG, WebP, MP4, WebM veya MOV · görseller yüklemeden önce otomatik olarak 1920 px'e küçültülür; videolar en fazla 80 MB olabilir.</small><input type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime" /></label><label id="category-field">Kategori <select id="category"><option>Photography</option><option>Collages</option><option>Drawings</option><option>Films</option><option>Video art</option></select></label><label id="project-field">Proje / seri <input name="projectId" placeholder="İsteğe bağlı seri adı" /></label><div id="event-fields" class="event-fields" hidden><label>Başlangıç tarihi <input name="eventStart" type="date" /></label><label>Bitiş tarihi <input name="eventEnd" type="date" /></label></div><div class="language-columns"><fieldset><legend>Türkçe</legend><label>Başlık <input required name="titleTr" /></label><label>Açıklama <span class="editor-tools" aria-label="Metni biçimlendir"><button type="button" title="Paragraf" aria-label="Paragraf" data-command="formatBlock" data-value="p">P</button><button type="button" title="Ara başlık" aria-label="Ara başlık" data-command="formatBlock" data-value="h2">H</button><button type="button" title="Kalın" aria-label="Kalın" data-command="bold"><b>B</b></button><button type="button" title="İtalik" aria-label="İtalik" data-command="italic"><i>I</i></button><button type="button" title="Altı çizili" aria-label="Altı çizili" data-command="underline"><u>U</u></button><button type="button" title="Madde listesi" aria-label="Madde listesi" data-command="insertUnorderedList">•</button><button type="button" title="Numaralı liste" aria-label="Numaralı liste" data-command="insertOrderedList">1.</button><button type="button" title="Alıntı" aria-label="Alıntı" data-command="formatBlock" data-value="blockquote">❝</button><button type="button" title="Bağlantı ekle" aria-label="Bağlantı ekle" data-command="createLink">↗</button><button type="button" title="Görsel ekle" aria-label="Görsel ekle" data-command="insertImage">▧</button><button type="button" title="YouTube videosu ekle" aria-label="YouTube videosu ekle" data-command="insertYoutube">▶</button><button type="button" title="Vimeo videosu ekle" aria-label="Vimeo videosu ekle" data-command="insertVimeo">V</button><button type="button" title="Geri al" aria-label="Geri al" data-command="undo">↶</button><button type="button" title="Yinele" aria-label="Yinele" data-command="redo">↷</button><button type="button" title="Biçimi temizle" aria-label="Biçimi temizle" data-command="removeFormat">Tx</button></span><div class="rich-editor" contenteditable="true" data-editor="descriptionTr" data-placeholder="Türkçe açıklamayı yazın."></div></label></fieldset><fieldset><legend>English</legend><label>Title <input required name="titleEn" /></label><label>Description <span class="editor-tools" aria-label="Format text"><button type="button" title="Paragraph" aria-label="Paragraph" data-command="formatBlock" data-value="p">P</button><button type="button" title="Heading" aria-label="Heading" data-command="formatBlock" data-value="h2">H</button><button type="button" title="Bold" aria-label="Bold" data-command="bold"><b>B</b></button><button type="button" title="Italic" aria-label="Italic" data-command="italic"><i>I</i></button><button type="button" title="Underline" aria-label="Underline" data-command="underline"><u>U</u></button><button type="button" title="Bulleted list" aria-label="Bulleted list" data-command="insertUnorderedList">•</button><button type="button" title="Numbered list" aria-label="Numbered list" data-command="insertOrderedList">1.</button><button type="button" title="Quote" aria-label="Quote" data-command="formatBlock" data-value="blockquote">❝</button><button type="button" title="Add link" aria-label="Add link" data-command="createLink">↗</button><button type="button" title="Add image" aria-label="Add image" data-command="insertImage">▧</button><button type="button" title="Add YouTube video" aria-label="Add YouTube video" data-command="insertYoutube">▶</button><button type="button" title="Add Vimeo video" aria-label="Add Vimeo video" data-command="insertVimeo">V</button><button type="button" title="Undo" aria-label="Undo" data-command="undo">↶</button><button type="button" title="Redo" aria-label="Redo" data-command="redo">↷</button><button type="button" title="Clear formatting" aria-label="Clear formatting" data-command="removeFormat">Tx</button></span><div class="rich-editor" contenteditable="true" data-editor="descriptionEn" data-placeholder="Write the English description."></div></label></fieldset></div><div class="form-actions"><button class="secondary" type="button" id="save-draft">Taslak olarak kaydet</button><button class="primary" type="submit">Yayınla ↗</button></div></form></section>
      <section class="content-list" aria-labelledby="library-title"><div class="library-toolbar"><div><p id="library-kicker" class="kicker">İçerik arşivi</p><h2 id="library-title"><span id="library-heading">Tüm içerikler</span></h2></div><button id="new-category-content" type="button" class="new-content">Yeni içerik ekle ↗</button></div><div class="status-tabs" aria-label="Yayın durumu"><button type="button" class="is-active" data-status-filter="all">Tümü</button><button type="button" data-status-filter="published">Yayında</button><button type="button" data-status-filter="draft">Taslak</button></div><div id="content-items"><p class="empty">İçerikler yükleniyor…</p></div></section>
      </div>
    </main><script src="/studio/app.js?v=20261024-video-editor" defer></script>
  </body>
</html>
