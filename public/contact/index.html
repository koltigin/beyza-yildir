  <body>
    <header class="bar"><a class="logo" href="../">Beyza<br />Yıldır<i>.</i></a><div class="page-actions"><button class="page-language-toggle" type="button" aria-label="Dili değiştir">TR <span>/</span> EN</button><a class="back" href="../">← Ana sayfa</a></div></header>
    <main class="contact">
      <h1>Merhaba<br />de<em>.</em></h1>
      <p class="contact-intro">Bir proje, sergi, iş birliği ya da sadece bir not için mesaj bırak.</p>
      <form id="contact-form" class="contact-form">
        <label>Adın <input required name="name" autocomplete="name" /></label>
        <label>E-posta adresin <input required type="email" name="email" autocomplete="email" /></label>
        <label>Mesajın <textarea required name="message" rows="7"></textarea></label>
        <label class="honeypot" aria-hidden="true">Web sitesi <input tabindex="-1" name="website" autocomplete="off" /></label>
        <button type="submit">Mesaj gönder ↗</button>
        <p id="form-status" class="form-note" role="status">Mesajın doğrudan Beyza’ya iletilir.</p>
      </form>
    </main>
    <footer class="footer">© Beyza Yıldır <span>All rights reserved</span></footer><script src="app.js?v=20261024-related-posts" defer></script>
