<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Beyza Yıldır ile iletişime geçin" />
    <title>İletişim — Beyza Yıldır</title>
    <link rel="stylesheet" href="../pages.css?v=20261023-layout1" />
  </head>
  <body>
    <header class="bar"><a class="logo" href="../">Beyza<br />Yıldır<i>.</i></a><a class="back" href="../">← Ana sayfa</a></header>
    <main class="contact">
      <p class="kicker">05 / iletişim</p><h1>Merhaba<br />de<em>.</em></h1>
      <p class="contact-intro">Bir proje, sergi, iş birliği ya da sadece bir not için mesaj bırak.</p>
      <form id="contact-form" class="contact-form">
        <label>Adın <input required name="name" autocomplete="name" /></label>
        <label>E-posta adresin <input required type="email" name="email" autocomplete="email" /></label>
        <label>Mesajın <textarea required name="message" rows="7"></textarea></label>
        <label class="honeypot" aria-hidden="true">Web sitesi <input tabindex="-1" name="website" autocomplete="off" /></label>
        <button type="submit">Mesaj gönder ↗</button>
        <p id="form-status" class="form-note" role="status">Mesajın doğrudan Beyza’ya iletilir.</p>
      </form>
      <div class="contact-socials" aria-label="Sosyal medya"><a href="https://www.instagram.com/yildirworks" target="_blank" rel="noreferrer">Instagram ↗</a><a href="https://vimeo.com/beyzayildir" target="_blank" rel="noreferrer">Vimeo ↗</a><a href="https://youtube.com/@beyzayildir" target="_blank" rel="noreferrer">YouTube ↗</a></div>
    </main>
    <footer class="footer">© Beyza Yıldır <span>All rights reserved</span></footer><script src="app.js?v=20261023-layout1" defer></script>
  </body>
</html>
